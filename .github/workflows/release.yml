name: Build desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-apple-signing:
    name: Detect Apple signing credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.credentials.outputs.configured }}
    steps:
      - id: credentials
        shell: bash
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -n "$MAC_CERTIFICATE_BASE64" && -n "$MAC_CSC_KEY_PASSWORD" && -n "$APPLE_API_KEY_P8_BASE64" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Apple credentials are incomplete; macOS installers will be built unsigned and without notarization."
          fi

  build-windows:
    name: Build Windows x64 one-click installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            diffutils
            nasm
            pkgconf
          pacboy: >-
            toolchain:p
            pkgconf:p
            libass:p
      - run: npm ci
      - name: Build LGPL FFmpeg with MediaFoundation
        shell: msys2 {0}
        run: |
          set +e
          bash scripts/build-ffmpeg-runtime.sh 2>&1 | tee ffmpeg-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [[ $build_status -ne 0 ]]; then
            diagnostic="$(tail -n 60 ffmpeg-build.log)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=FFmpeg runtime build failed::$diagnostic"
            exit "$build_status"
          fi
      - name: Upload FFmpeg failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ffmpeg-build-log
          path: ffmpeg-build.log
          if-no-files-found: ignore
      - run: npm run media:verify
      - name: Match package version to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm run desktop:smoke
      - name: Build unsigned Windows x64 installer
        run: npm run dist:win
      - name: Verify x64 installer output
        shell: pwsh
        run: |
          $installers = Get-ChildItem "release/*.exe"
          if ($installers.Count -eq 0) { throw "Windows installer was not produced." }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "NotSigned") {
              throw "Expected an unsigned installer, but $($installer.Name) reports: $($signature.Status)"
            }
            if ($installer.Name -notmatch "win-x64") {
              throw "Installer filename does not identify the x64 target: $($installer.Name)"
            }
            Write-Host "Verified unsigned Windows x64 installer: $($installer.Name)"
          }
          $runtime = "release/win-unpacked/resources/media-runtime"
          $requiredRuntimeFiles = @("ffmpeg.exe", "FFMPEG-LGPL-2.1.txt", "FFMPEG-SOURCE.txt", "FFMPEG-BUILD-CONFIG.txt")
          foreach ($requiredFile in $requiredRuntimeFiles) {
            if (-not (Test-Path "$runtime/$requiredFile")) {
              throw "Packaged Windows installer is missing embedded FFmpeg file: $requiredFile"
            }
          }
          Write-Host "Verified embedded Windows FFmpeg runtime and compliance files."
      - name: Stage Windows installer
        shell: bash
        run: |
          mkdir -p artifact
          cp release/*.exe artifact/
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: artifact/
          if-no-files-found: error

  build-macos:
    name: Build macOS Apple Silicon installer
    needs: detect-apple-signing
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install LGPL FFmpeg build dependencies
        run: |
          if brew tap | grep -qx 'aws/tap'; then brew untap aws/tap; fi
          brew install pkg-config nasm libass
      - name: Build LGPL FFmpeg with VideoToolbox
        run: |
          set +e
          bash scripts/build-ffmpeg-runtime.sh 2>&1 | tee ffmpeg-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [[ $build_status -ne 0 ]]; then
            diagnostic="$(tail -n 60 ffmpeg-build.log)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=FFmpeg runtime build failed::$diagnostic"
            exit "$build_status"
          fi
      - name: Upload FFmpeg failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-ffmpeg-build-log
          path: ffmpeg-build.log
          if-no-files-found: ignore
      - run: npm run media:verify
      - name: Match package version to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Prepare Apple signing and notarization credentials
        if: needs.detect-apple-signing.outputs.configured == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$API_KEY_BASE64" || -z "$API_KEY_ID" || -z "$API_ISSUER" ]]; then
            echo "Missing one or more macOS signing/notarization repository secrets." >&2
            exit 1
          fi
          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.CERTIFICATE_BASE64, 'base64'))" "$RUNNER_TEMP/macos-signing.p12"
          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.API_KEY_BASE64, 'base64'))" "$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/macos-signing.p12" "$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
      - run: npm test
      - run: npm run desktop:smoke
      - name: Build signed and notarized macOS installer
        if: needs.detect-apple-signing.outputs.configured == 'true'
        run: npm run release:mac -- --arm64
        env:
          CSC_LINK: ${{ runner.temp }}/macos-signing.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify Developer ID signature and notarization ticket
        if: needs.detect-apple-signing.outputs.configured == 'true'
        run: |
          APP_PATH="$(find release -maxdepth 2 -type d -name 'DashCut.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then echo "DashCut.app was not produced" >&2; exit 1; fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          codesign --verify --verbose=2 release/*.dmg
      - name: Build unsigned macOS installer
        if: needs.detect-apple-signing.outputs.configured != 'true'
        run: npm run dist:mac -- --arm64 -c.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify unsigned macOS installer
        if: needs.detect-apple-signing.outputs.configured != 'true'
        run: |
          APP_PATH="$(find release -maxdepth 2 -type d -name 'DashCut.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then echo "DashCut.app was not produced" >&2; exit 1; fi
          lipo -archs "$APP_PATH/Contents/MacOS/DashCut" | grep -qw arm64
          hdiutil verify release/*.dmg
      - name: Verify embedded FFmpeg runtime
        run: |
          APP_PATH="$(find release -maxdepth 2 -type d -name 'DashCut.app' -print -quit)"
          RUNTIME_PATH="$APP_PATH/Contents/Resources/media-runtime"
          for required_file in ffmpeg FFMPEG-LGPL-2.1.txt FFMPEG-SOURCE.txt FFMPEG-BUILD-CONFIG.txt; do
            if [[ ! -f "$RUNTIME_PATH/$required_file" ]]; then
              echo "Packaged macOS installer is missing embedded FFmpeg file: $required_file" >&2
              exit 1
            fi
          done
          lipo -archs "$RUNTIME_PATH/ffmpeg" | grep -qw arm64
          echo "Verified embedded macOS FFmpeg runtime and compliance files."
      - name: Stage macOS installer
        run: |
          mkdir -p artifact
          cp release/*.dmg artifact/
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-installer
          path: artifact/
          if-no-files-found: error

  release:
    name: Attach installers to GitHub Release
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success' && needs.build-macos.result == 'success'
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.dmg
