name: Build signed desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and sign Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Match package version to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Prepare Windows signing certificate
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" ]]; then
            echo "Missing WINDOWS_CERTIFICATE_BASE64 or WIN_CSC_KEY_PASSWORD repository secret." >&2
            exit 1
          fi
          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.CERTIFICATE_BASE64, 'base64'))" "$RUNNER_TEMP/windows-signing.pfx"
      - run: npm test
      - run: npm run desktop:smoke
      - name: Build signed Windows installer
        run: npm run release:win
        env:
          WIN_CSC_LINK: ${{ runner.temp }}/windows-signing.pfx
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installers = Get-ChildItem "release/*.exe"
          if ($installers.Count -eq 0) { throw "Windows installer was not produced." }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature on $($installer.Name): $($signature.Status)"
            }
            Write-Host "Verified $($installer.Name) signed by $($signature.SignerCertificate.Subject)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  build-macos:
    name: Build, sign and notarize macOS installer
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Match package version to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Prepare Apple signing and notarization credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$API_KEY_BASE64" || -z "$API_KEY_ID" || -z "$API_ISSUER" ]]; then
            echo "Missing one or more macOS signing/notarization repository secrets." >&2
            exit 1
          fi
          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.CERTIFICATE_BASE64, 'base64'))" "$RUNNER_TEMP/macos-signing.p12"
          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.API_KEY_BASE64, 'base64'))" "$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/macos-signing.p12" "$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
      - run: npm test
      - run: npm run desktop:smoke
      - name: Build signed and notarized macOS installer
        run: npm run release:mac
        env:
          CSC_LINK: ${{ runner.temp }}/macos-signing.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify Developer ID signature and notarization ticket
        run: |
          codesign --verify --deep --strict --verbose=2 "release/mac-universal/FrameFlow.app"
          xcrun stapler validate "release/mac-universal/FrameFlow.app"
          spctl --assess --type execute --verbose=4 "release/mac-universal/FrameFlow.app"
          codesign --verify --verbose=2 release/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: release/*.dmg
          if-no-files-found: error

  release:
    name: Attach signed installers to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.dmg
