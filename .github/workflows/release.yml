name: Build desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-apple-signing:
    name: Detect Apple signing credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.credentials.outputs.configured }}
    steps:
      - id: credentials
        shell: bash
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -n "$MAC_CERTIFICATE_BASE64" && -n "$MAC_CSC_KEY_PASSWORD" && -n "$APPLE_API_KEY_P8_BASE64" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Apple credentials are incomplete; macOS installers will be skipped."
          fi

  build-windows:
    name: Build Windows x64 one-click installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            diffutils
            nasm
            pkgconf
          pacboy: >-
            toolchain:p
            pkgconf:p
            libass:p
      - run: npm ci
      - name: Build LGPL FFmpeg with MediaFoundation
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg-runtime.sh
      - run: npm run media:verify
      - name: Match package version to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm run desktop:smoke
      - name: Build unsigned Windows x64 installer
        run: npm run dist:win
      - name: Verify x64 installer output
        shell: pwsh
        run: |
          $installers = Get-ChildItem "release/*.exe"
          if ($installers.Count -eq 0) { throw "Windows installer was not produced." }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "NotSigned") {
              throw "Expected an unsigned installer, but $($installer.Name) reports: $($signature.Status)"
            }
            if ($installer.Name -notmatch "win-x64") {
              throw "Installer filename does not identify the x64 target: $($installer.Name)"
            }
            Write-Host "Verified unsigned Windows x64 installer: $($installer.Name)"
          }
      - name: Stage FFmpeg compliance record
        shell: bash
        run: |
          mkdir -p artifact/compliance
          cp release/*.exe artifact/
          cp media-runtime/current/FFMPEG-BUILD-CONFIG.txt artifact/compliance/windows-x64-FFMPEG-BUILD-CONFIG.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifact/
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }} installer
    needs: detect-apple-signing
    if: needs.detect-apple-signing.outputs.configured == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install LGPL FFmpeg build dependencies
        run: brew install pkg-config nasm libass
      - name: Build LGPL FFmpeg with VideoToolbox
        run: bash scripts/build-ffmpeg-runtime.sh
      - run: npm run media:verify
      - name: Match package version to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Prepare Apple signing and notarization credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$API_KEY_BASE64" || -z "$API_KEY_ID" || -z "$API_ISSUER" ]]; then
            echo "Missing one or more macOS signing/notarization repository secrets." >&2
            exit 1
          fi
          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.CERTIFICATE_BASE64, 'base64'))" "$RUNNER_TEMP/macos-signing.p12"
          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.API_KEY_BASE64, 'base64'))" "$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/macos-signing.p12" "$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
      - run: npm test
      - run: npm run desktop:smoke
      - name: Build signed and notarized macOS installer
        run: npm run release:mac -- --${{ matrix.arch }}
        env:
          CSC_LINK: ${{ runner.temp }}/macos-signing.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify Developer ID signature and notarization ticket
        run: |
          APP_PATH="$(find release -maxdepth 2 -type d -name 'DashCut.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then echo "DashCut.app was not produced" >&2; exit 1; fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          codesign --verify --verbose=2 release/*.dmg
      - name: Stage FFmpeg compliance record
        run: |
          mkdir -p artifact/compliance
          cp release/*.dmg artifact/
          cp media-runtime/current/FFMPEG-BUILD-CONFIG.txt "artifact/compliance/macos-${{ matrix.arch }}-FFMPEG-BUILD-CONFIG.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-installer
          path: artifact/
          if-no-files-found: error

  release:
    name: Attach installers to GitHub Release
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success' && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Attach corresponding FFmpeg source and compliance material
        run: |
          source scripts/ffmpeg-runtime.env
          mkdir -p release/compliance
          curl --fail --location --retry 3 "$FFMPEG_SOURCE_URL" --output "release/compliance/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          printf '%s  %s\n' "$FFMPEG_SHA256" "release/compliance/ffmpeg-${FFMPEG_VERSION}.tar.xz" | sha256sum -c -
          cp scripts/build-ffmpeg-runtime.sh scripts/ffmpeg-runtime.env THIRD_PARTY_NOTICES.md release/compliance/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.dmg
            release/compliance/*
